
<!DOCTYPE html>
<html>
<head>
    <title>Transcription History</title>

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container mt-5">

    <h2>Transcription History</h2>

    <a href="/" class="btn btn-primary mb-4">
        Back to Dashboard
    </a>

    {% for record in records %}

    <div class="card p-3 mb-3">

        <form action="/edit/{{ record['id'] }}" method="POST">

            <textarea name="text"
            class="form-control mb-2"
            rows="3"
            required>{{ record['text'] }}</textarea>

            <small>{{ record['created_at'] }}</small>

            <div class="mt-3">

                <button type="submit"
                class="btn btn-success btn-sm">
                    Update
                </button>

        </form>

                <form action="/delete/{{ record['id'] }}"
                method="POST"
                class="d-inline"
                onsubmit="return confirm('Delete this transcription?')">

                    <button type="submit"
                    class="btn btn-danger btn-sm">
                        Delete
                    </button>

                </form>

            </div>

    </div>

    {% else %}

    <p>No transcription history found.</p>

    {% endfor %}

</div>

</body>
</html>
